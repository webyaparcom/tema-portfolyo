<section class="modulex-rf3" id="rf3-{{id}}">
  <div class="modulex-rf3-wrap">
    <aside class="modulex-rf3-panel">
      {{rf3head}}
      <h3 class="modulex-rf3-saath">{{hoursTitle}}</h3>
      <table class="modulex-rf3-tablo"><tbody>{{rf3tablo}}</tbody></table>
    </aside>
    <div class="modulex-rf3-formkap">
      {{rf3kapali}}
      <noscript><p class="modulex-rf3-kapali">{{noscript}}</p></noscript>
      <form class="modulex-rf3-form" novalidate data-rf3-form>
        <label class="modulex-rf3-alan">
          <span class="modulex-rf3-etiket">{{dateLabel}} <span aria-hidden="true">*</span></span>
          <input type="date" name="tarih" required data-rf3-tarih />
        </label>
        <fieldset class="modulex-rf3-dilimler">
          <legend class="modulex-rf3-etiket">{{daypartLabel}} <span aria-hidden="true">*</span></legend>
          <div class="modulex-rf3-dizgi">{{rf3dilimler}}</div>
        </fieldset>
        <label class="modulex-rf3-alan">
          <span class="modulex-rf3-etiket">{{nameLabel}} <span aria-hidden="true">*</span></span>
          <input type="text" name="ad" autocomplete="name" maxlength="120" required />
        </label>
        <div class="modulex-rf3-ikili">
          <label class="modulex-rf3-alan">
            <span class="modulex-rf3-etiket">{{phoneLabel}} <span aria-hidden="true">*</span></span>
            <input type="tel" name="telefon" autocomplete="tel" inputmode="tel" dir="ltr" maxlength="32" required />
          </label>
          <label class="modulex-rf3-alan">
            <span class="modulex-rf3-etiket">{{emailLabel}}</span>
            <input type="email" name="eposta" autocomplete="email" dir="ltr" maxlength="254" />
          </label>
        </div>
        <label class="modulex-rf3-alan">
          <span class="modulex-rf3-etiket">{{noteLabel}}</span>
          <textarea name="not" rows="3" maxlength="1000"></textarea>
        </label>
        <label class="modulex-rf3-onay">
          <input type="checkbox" name="kvkk" required />
          <span>{{rf3kvkk}}</span>
        </label>
        <p class="modulex-rf3-hata" role="alert" data-rf3-hata hidden></p>
        <button type="submit" class="modulex-rf3-btn"{{rf3disabled}}><span class="material-symbols-outlined" aria-hidden="true">{{rf3ikon}}</span>{{rf3btn}}</button>
        <p class="modulex-rf3-tamam" role="status" aria-live="polite" data-rf3-tamam></p>
      </form>
    </div>
  </div>
  <script type="application/json" data-rf3-veri>{{rf3veri}}</script>
</section>

<style>
  /* Bilgi Panelli Randevu Talebi (randevu-formu-3). Panel zemini/yazısı panelbg/paneltext token çifti. */
  .modulex-rf3 {
    box-sizing: border-box; width: 100%;
    padding-block: clamp(32px, 6vw, 80px); padding-inline: clamp(16px, 4vw, 32px);
    background: --bgcolor--; color: --textcolor--;
  }
  .modulex-rf3 *, .modulex-rf3 *::before, .modulex-rf3 *::after { box-sizing: border-box; }
  .modulex-rf3 :where(span:not(.material-symbols-outlined), bdi, b, strong, em) { font: inherit; }
  .modulex-rf3-wrap {
    max-width: --max--; margin-inline: auto; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
    border-radius: --radius--; overflow: hidden; border: 1px solid --bordercolor--; background: --surface--;
  }
  .modulex-rf3-panel { padding: clamp(24px, 4vw, 48px); background: --panelbg--; color: --paneltext--; }
  .modulex-rf3-title { margin: 0 0 10px; font-size: clamp(1.5rem, 1.1rem + 1.4vw, 2.2rem); line-height: 1.2; color: inherit; }
  .modulex-rf3-desc { margin: 0 0 28px; line-height: 1.7; color: inherit; opacity: 0.92; }
  .modulex-rf3-saath { margin: 0 0 10px; font-size: 0.85rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: inherit; }
  .modulex-rf3-tablo { width: 100%; border-collapse: collapse; }
  .modulex-rf3-tablo th, .modulex-rf3-tablo td { padding: 8px 0; text-align: start; font-weight: 400; border-bottom: 1px solid color-mix(in srgb, --paneltext-- 25%, transparent); }
  .modulex-rf3-tablo td { text-align: end; font-variant-numeric: tabular-nums; }
  .modulex-rf3-kapaligun { opacity: 0.75; }

  .modulex-rf3-formkap { padding: clamp(24px, 4vw, 48px); }
  .modulex-rf3-form { display: grid; gap: 16px; }
  .modulex-rf3-ikili { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .modulex-rf3-alan { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .modulex-rf3-etiket { font-size: 0.92rem; font-weight: 700; color: --textcolor--; }
  .modulex-rf3-alan input, .modulex-rf3-alan textarea {
    width: 100%; min-height: 44px; padding: 10px 12px; font: inherit; color: --textcolor--; background: --bgcolor--;
    border: 1px solid color-mix(in srgb, --textcolor-- 35%, transparent); border-radius: 10px;
  }
  .modulex-rf3 [aria-invalid="true"] { border-color: --errcolor--; }
  .modulex-rf3-dilimler { margin: 0; padding: 0; border: 0; min-width: 0; }
  .modulex-rf3-dilimler legend { padding: 0; margin-bottom: 6px; }
  .modulex-rf3-dizgi { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .modulex-rf3-dilim { position: relative; }
  .modulex-rf3-dilim input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .modulex-rf3-dkart {
    display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 8px; border-radius: 12px; text-align: center;
    border: 2px solid --bordercolor--; background: --bgcolor--; font-weight: 700;
  }
  .modulex-rf3-dkart .material-symbols-outlined { color: --accent--; }
  .modulex-rf3-dilim input:checked + .modulex-rf3-dkart { border-color: --accent--; background: color-mix(in srgb, --accent-- 10%, --bgcolor--); }
  .modulex-rf3-dilim input:focus-visible + .modulex-rf3-dkart { outline: 3px solid --accent--; outline-offset: 2px; }
  .modulex-rf3-onay { display: flex; gap: 10px; align-items: flex-start; line-height: 1.5; font-size: 0.92rem; cursor: pointer; }
  .modulex-rf3-onay input { width: 20px; height: 20px; margin: 2px 0 0; flex: 0 0 auto; accent-color: --accent--; }
  .modulex-rf3-onay a { color: inherit; text-decoration: underline; }
  .modulex-rf3 input:focus-visible, .modulex-rf3 textarea:focus-visible, .modulex-rf3-onay a:focus-visible { outline: 3px solid --accent--; outline-offset: 2px; }
  .modulex-rf3-btn {
    justify-self: start; display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 24px;
    border: 0; border-radius: 10px; background: --accent--; color: --accentText--; font: inherit; font-weight: 700; cursor: pointer;
  }
  .modulex-rf3-btn:focus-visible { outline: 3px solid --textcolor--; outline-offset: 3px; }
  .modulex-rf3-btn[disabled] { opacity: 0.5; cursor: not-allowed; }
  .modulex-rf3-hata { margin: 0; color: --errcolor--; font-weight: 600; }
  .modulex-rf3-tamam { margin: 0; }
  .modulex-rf3-tamam:empty { display: none; }
  .modulex-rf3-kapali { margin: 0 0 16px; padding: 12px 14px; border-radius: 10px; background: --surface2--; color: --textcolor--; }

  @media (max-width: 860px) {
    .modulex-rf3-wrap { grid-template-columns: 1fr; }
    .modulex-rf3-ikili { grid-template-columns: 1fr; }
    .modulex-rf3-btn { justify-self: stretch; justify-content: center; }
    [class*="modulex"] { max-width: 100%; box-sizing: border-box; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-rf3 *, .modulex-rf3 *::before, .modulex-rf3 *::after { animation: none !important; transition: none !important; }
  }
</style>

<script>
  (function () {
    var kok = document.getElementById("rf3-{{id}}");
    if (!kok || kok.getAttribute("data-rf3-hazir") === "1") { return; }
    kok.setAttribute("data-rf3-hazir", "1");
    var P = {};
    try { P = JSON.parse(kok.querySelector("[data-rf3-veri]").textContent || "{}"); } catch (e) { P = {}; }
    var M = P.m || {};
    var form = kok.querySelector("[data-rf3-form]");
    var tarih = kok.querySelector("[data-rf3-tarih]");
    var hata = kok.querySelector("[data-rf3-hata]");
    var tamam = kok.querySelector("[data-rf3-tamam]");
    function iso(d) { return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
    var b = new Date();
    tarih.min = iso(new Date(b.getFullYear(), b.getMonth(), b.getDate() + (P.lead || 0)));
    tarih.max = iso(new Date(b.getFullYear(), b.getMonth(), b.getDate() + (P.max || 60)));
    /* wa.me numarası: randevu-formu ile aynı kural */
    function waNumara(s) {
      var d = String(s || "").replace(/\D/g, "");
      if (d.indexOf("00") === 0) { return d.slice(2); }
      if (d.length === 11 && d.charAt(0) === "0") { return "90" + d.slice(1); }
      if (d.length === 10 && d.charAt(0) === "5") { return "90" + d; }
      return d;
    }
    function sablon(str, v) { return String(str || "").replace(/\{(\w+)\}/g, function (m, k) { return v[k] !== undefined ? String(v[k]) : m; }); }
    function hataYaz(metin, alan) {
      var eski = form.querySelectorAll('[aria-invalid="true"]');
      for (var i = 0; i < eski.length; i++) { eski[i].removeAttribute("aria-invalid"); }
      hata.textContent = metin || "";
      hata.hidden = !metin;
      if (alan) { alan.setAttribute("aria-invalid", "true"); alan.focus(); }
    }
    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      tamam.textContent = "";
      if (!P.hedef) { return; }
      var f = form.elements;
      var dilim = form.querySelector('input[name="dilim"]:checked');
      if (!f.tarih.value) { hataYaz(M.zorunlu, f.tarih); return; }
      var gun = new Date(f.tarih.value + "T12:00:00").getDay() || 7;
      if (P.gunler && P.gunler.length && P.gunler.indexOf(gun) === -1) { hataYaz(M.kapali, f.tarih); return; }
      var ilkDilim = form.querySelector('input[name="dilim"]');
      if (ilkDilim && !dilim) { hataYaz(M.zorunlu, ilkDilim); return; }
      if (!String(f.ad.value).trim()) { hataYaz(M.zorunlu, f.ad); return; }
      var rakam = String(f.telefon.value).replace(/\D/g, "").length;
      if (rakam < 10 || rakam > 15) { hataYaz(M.tel, f.telefon); return; }
      if (!f.kvkk.checked) { hataYaz(M.zorunlu, f.kvkk); return; }
      hataYaz("");
      var tarihMetni = f.tarih.value;
      try { tarihMetni = new Date(f.tarih.value + "T12:00:00").toLocaleDateString(document.documentElement.lang || undefined, { dateStyle: "full" }); } catch (e) { /* ISO kalır */ }
      var metin = sablon(P.sablon, {
        date: tarihMetni, part: dilim ? dilim.value : "-", name: String(f.ad.value).trim(), phone: String(f.telefon.value).trim(),
        email: String(f.eposta.value).trim() || "-", note: String(f.not.value).trim() || "-"
      });
      var url = P.submit === "mailto"
        ? "mailto:" + P.hedef + "?subject=" + encodeURIComponent(P.konu || "") + "&body=" + encodeURIComponent(metin.replace(/\n/g, "\r\n"))
        : "https://wa.me/" + waNumara(P.hedef) + "?text=" + encodeURIComponent(metin);
      if (P.submit === "mailto") { window.location.href = url; } else { window.open(url, "_blank", "noopener"); }
      tamam.textContent = M.tamam || "";
    });
  })();
</script>
